[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextshot-research-core"
version = "0.1.0"
description = "Core structured composition prediction and region correspondence from NextShot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.8,<3", "numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nextshot", "data_processing"]
